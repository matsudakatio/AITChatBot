# ローカル開発用設定（docker compose up で自動適用される）
# 研究室Macで本番モードで動かしたいときは
#   docker compose -f docker-compose.yml up -d --build
# のように override を読み込まないコマンドを使う

services:
  web:
    volumes:
      - .:/app
      - vectorstore_data:/app/vectorstore
    environment:
      - FLASK_DEBUG=1
      # 開発時は検証用のデバッグ情報（処理時間・出典チャンク・スコア等）を
      # 画面に表示する。本番(docker-compose.yml)では無効。
      - DEBUG=true
