services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-5001}:5000"
    volumes:
      - vectorstore_data:/app/vectorstore
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - EMBED_MODEL=llama3
      - LLM_MODEL=elyza-jp
      - ALWAYS_REBUILD=false
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
  vectorstore_data:
